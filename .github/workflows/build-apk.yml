name: Build ATMBANK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ATM_BANK_Android_Project (1)/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle -p "ATM_BANK_Android_Project (1)" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMBANK-debug-apk
          path: ATM_BANK_Android_Project (1)/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
